<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SiHalangan</title>
    <style>
        .main-logo {
    display: block;
    margin: 0 auto 15px auto; /* margin auto membuat logo otomatis berada di tengah */
    max-width: 100px; /* Anda bisa mengubah angka ini untuk memperbesar/memperkecil logo */
    height: auto;
}
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f7f6; padding: 20px; color: #333; }
        .container { max-width: 800px; margin: auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        h1 { text-align: center; margin-bottom: 20px; font-size: 24px;}
        select, button, input[type="date"] { padding: 10px; border-radius: 5px; border: 1px solid #ccc; font-size: 16px; margin-bottom: 15px;}
        .controls { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 20px; }
        .btn-primary { background-color: #007bff; color: white; border: none; cursor: pointer; }
        .btn-print { background-color: #6c757d; color: white; border: none; cursor: pointer; }
        
        .student-item { display: flex; align-items: center; border-bottom: 1px solid #eee; padding: 10px 0; }
        /* Ubah persentase lebar agar nama siswa punya ruang lebih luas di HP */
.student-info { width: 50%; display: flex; align-items: center; gap: 10px; font-weight: bold;}
.history-container { width: 50%; display: flex; gap: 5px; overflow-x: auto; padding-bottom: 5px;}

/* Tambahkan min-width dan flex-shrink pada check-btn */
.check-btn { 
    width: 25px; 
    height: 25px; 
    min-width: 25px; /* Mencegah berubah ukuran */
    flex-shrink: 0;  /* Mencegah tergencet teks yang panjang */
    border-radius: 50%; 
    border: 2px solid #ccc; 
    background: white; 
    cursor: pointer; 
    display: inline-block; 
}
        .check-btn.red { background-color: #dc3545; border-color: #dc3545; }

        /* History Boxes */
        .history-box { min-width: 40px; height: 40px; border-radius: 5px; display: flex; align-items: center; justify-content: center; font-size: 10px; color: white; font-weight: bold;}
        .box-green { background-color: #28a745; }
        .box-red { background-color: #dc3545; }
        .history-label { display: flex; flex-direction: column; align-items: center; font-size: 11px; }

        .loading { text-align: center; font-style: italic; color: #666; display: none; }

        /* Secara default sembunyikan judul print di layar HP/Laptop */
        .print-only { display: none; }

        /* Print Styles */
        /* Print Styles - Update Terbaru */
        @media print {
            /* 1. Paksa browser mencetak warna kotak (Hijau/Merah) */
            * {
                -webkit-print-color-adjust: exact !important;
                print-color-adjust: exact !important;
            }

            /* 2. Atur ukuran kertas dan margin agar luas */
            @page {
                size: A4 portrait;
                margin: 1cm; 
            }

            body { 
                background: white; 
                padding: 0; 
                font-size: 11px; /* Font dikecilkan agar muat banyak */
            }
            
            .container { 
                box-shadow: none; 
                max-width: 100%; 
                padding: 0;
            }

            /* 3. Sembunyikan elemen UI yang tidak perlu dicetak */
            .controls, .check-btn, .action-area, img.main-logo { 
                display: none !important; 
            }

            /* Tampilkan judul print di kertas dengan format rapi */
            .print-only { 
                display: block !important; 
                text-align: center; 
                font-size: 16px; 
                margin-top: -10px;
                margin-bottom: 15px;
            }
            
            /* Judul SMAN 9 diperkecil sedikit agar tidak memakan tempat */
            h1 { font-size: 18px; margin-bottom: 5px; }

            /* 4. Rapatkan jarak antar siswa (Target: 35+ anak muat 1 halaman) */
            .student-item { 
                border-bottom: 1px solid #ccc; 
                padding: 4px 0; /* Padding atas bawah dikecilkan */
                page-break-inside: avoid; /* Mencegah baris nama terpotong antar halaman */
            }

            /* Lebar disesuaikan untuk kertas */
            .student-info { width: 40%; font-size: 12px;}
            .history-container { width: 60%; }

            /* 5. Sesuaikan ukuran kotak riwayat agar rapi di kertas */
            .history-box { 
                border: 1px solid #000; 
                color: white !important; /* Kembalikan font putih karena background berwarna sudah muncul */
                height: 20px; /* Kotak dipendekkan */
                min-width: 20px;
                font-size: 9px;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <img src="https://lh3.googleusercontent.com/u/0/d/1NmhujSqCWX3fY30wSlAe9Ur5aR0jevXc" alt="Logo Instansi" class="main-logo">
    <h1>Presensi Halangan Shalat<br>SMAN 9 Surabaya</h1>
    <h2 id="judulPrint" class="print-only"></h2>
    <div class="controls">
        <select id="kelasSelect">
            <option value="">-- Pilih Kelas --</option>
            <!-- Tulis daftar kelas secara manual di sini -->
            <option value="X-1">X-1</option>
            <option value="X-2">X-2</option>
            <option value="X-3">X-3</option>
            <option value="X-4">X-4</option>
            <option value="X-5">X-5</option>
            <option value="X-6">X-6</option>
            <option value="X-7">X-7</option>
            <option value="X-8">X-8</option>
            <option value="X-9">X-9</option>
            <option value="X-10">X-10</option>
            <option value="X-11">X-11</option>
            <option value="XI A-1">XI A-1</option>
            <option value="XI A-2">XI A-2</option>
            <option value="XI A-3">XI A-3</option>
            <option value="XI A-4">XI A-4</option>
            <option value="XI B">XI B</option>
            <option value="XI C-1">XI C-1</option>
             <option value="XI C-2">XI C-2</option>
            <option value="XI C-3">XI C-3</option>
             <option value="XI D-1">XI D-1</option>
             <option value="XI D-2">XI D-2</option>
             <option value="XII A-1">XII A-1</option>
             <option value="XII A-2">XII A-2</option>
             <option value="XII A-3">XII A-3</option>
             <option value="XII A-4">XII A-4</option>
            <option value="XII B">XII B</option>
            <option value="XII C-1">XII C-1</option>
             <option value="XII C-2">XII C-2</option>
            <option value="XII C-3">XII C-3</option>
             <option value="XII C-4">XII C-4</option>
             <option value="XII D">XII D</option>
            <!-- Tambahkan terus sesuai jumlah kelas di SMAN 9 -->
        </select>
        <input type="date" id="tanggalInput" required>
        <button class="btn-primary" onclick="loadData()">Tampilkan</button>
        <button class="btn-print" onclick="cetakDanReset()">Cetak Rekap</button>
    </div>

    <div id="loading" class="loading">Memuat data...</div>
    
    <div id="studentList"></div>
    
    <div class="controls action-area" style="margin-top: 20px; display: none;" id="saveArea">
        <button class="btn-primary" onclick="simpanPresensi()" style="width: 100%;">Simpan Presensi Hari Ini</button>
    </div>
</div>

<script>
    // MASUKKAN URL WEB APP GAS ANDA DI SINI
    const API_URL = "https://script.google.com/macros/s/AKfycbyuicKD7tJVwcaJ7w2dXR99lgiNGiQK2YhKt0f-GcLqRZ7NmsogePWmgjIzZgW3B9nM/exec"; 
    
    let currentData = { students: [], dates: [], logs: [] };
    let todayReds = new Set();

    // Set tanggal hari ini sebagai default
    document.getElementById('tanggalInput').valueAsDate = new Date();

    function showLoading(show) {
        document.getElementById('loading').style.display = show ? 'block' : 'none';
        document.getElementById('studentList').style.display = show ? 'none' : 'block';
    }

    function loadData() {
        const kelas = document.getElementById('kelasSelect').value;
        if (!kelas) return alert("Pilih kelas terlebih dahulu");

        document.getElementById('judulPrint').innerText = "Rekap Kelas: " + kelas;
        showLoading(true);
        fetch(`${API_URL}?action=get_data&kelas=${kelas}`)
            .then(res => res.json())
            .then(data => {
                currentData = data;
                todayReds.clear();
                renderStudents();
                showLoading(false);
                document.getElementById('saveArea').style.display = 'block';
            });
    }

    function renderStudents() {
        const container = document.getElementById('studentList');
        container.innerHTML = '';

        currentData.students.forEach(student => {
            const div = document.createElement('div');
            div.className = 'student-item';

            // --- Mulai Pembuatan Tombol Checkbox ---
            const checkBtn = document.createElement('div');
            checkBtn.className = 'check-btn';
            
            // LOGIKA PENTING: Inilah yang membuat tombol bisa diklik dan berubah warna
            checkBtn.onclick = function() {
                // Toggled (tukar) kelas 'red'. Jika ada, hapus. Jika tidak ada, tambahkan.
                this.classList.toggle('red');
                
                // Perbarui daftar presensi merah (todayReds)
                if(this.classList.contains('red')) {
                    todayReds.add(student.id);
                } else {
                    todayReds.delete(student.id);
                }
                
                console.log("Siswa dengan ID", student.id, "dipilih sebagai berhalangan.");
            };
            // --- Selesai Pembuatan Tombol Checkbox ---

            // --- Mulai Pembuatan Info Siswa (menggunakan appendChild agar tombol tidak rusak) ---
            const info = document.createElement('div');
            info.className = 'student-info';
            info.appendChild(checkBtn);
            
            const spanNama = document.createElement('span');
            spanNama.innerText = student.nama;
            info.appendChild(spanNama);
            // --- Selesai Pembuatan Info Siswa ---

            // --- Mulai Pembuatan Riwayat (tetap sama) ---
            const history = document.createElement('div');
            history.className = 'history-container';
            
            currentData.dates.forEach(date => {
                const dateStr = date.split('-')[2] + '/' + date.split('-')[1];
                const isRed = currentData.logs.some(log => log.id_siswa == student.id && log.tanggal === date);
                
                const boxWrapper = document.createElement('div');
                boxWrapper.className = 'history-label';
                
                const box = document.createElement('div');
                box.className = `history-box ${isRed ? 'box-red' : 'box-green'}`;
                box.innerText = dateStr;
                
                boxWrapper.appendChild(box);
                history.appendChild(boxWrapper);
            });
            // --- Selesai Pembuatan Riwayat ---

            div.appendChild(info);
            div.appendChild(history);
            container.appendChild(div);
        });
    }
        
        function simpanPresensi() {
        const kelas = document.getElementById('kelasSelect').value;
        const tanggal = document.getElementById('tanggalInput').value;
        
        if(!kelas || !tanggal) return alert("Kelas dan Tanggal harus diisi!");
        
        document.getElementById('saveArea').innerHTML = "Menyimpan...";
        
        const payload = {
            action: 'save',
            kelas: kelas,
            tanggal: tanggal,
            red_students: Array.from(todayReds)
        };

        fetch(API_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'text/plain;charset=utf-8' },
            body: JSON.stringify(payload)
        })
        .then(res => res.json())
        .then(res => {
            alert("Data berhasil disimpan!");
            document.getElementById('saveArea').innerHTML = `<button class="btn-primary" onclick="simpanPresensi()" style="width: 100%;">Simpan Presensi Hari Ini</button>`;
            loadData(); // Refresh UI
        });
    }

    function cetakDanReset() {
        const kelas = document.getElementById('kelasSelect').value;
        if (!kelas) return alert("Pilih kelas yang akan dicetak");

        // 1. Memicu Dialog Print Browser
        window.print();

        // 2. Konfirmasi Reset (muncul setelah dialog print selesai/ditutup)
        setTimeout(() => {
            const confirmReset = confirm("Rekap telah dicetak. Apakah Anda ingin mereset history dan hanya menyisakan data terakhir?");
            if (confirmReset) {
                showLoading(true);
                fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify({ action: 'reset', kelas: kelas })
                })
                .then(res => res.json())
                .then(res => {
                    alert("History berhasil direset.");
                    loadData(); // Refresh layar
                });
            }
        }, 500);
    }
</script>

</body>
</html>
